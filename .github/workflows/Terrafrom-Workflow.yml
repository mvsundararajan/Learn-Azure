name: simple test workflow

on:
  push:
    branches:
      - main

jobs:
   
  run-script:
    runs-on: ubuntu-latest
    steps:
      # MUST HAVE THIS STEP:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run python script
        run: python code/hello_world.py